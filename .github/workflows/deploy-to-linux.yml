name: Deploy to Linux App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tin200app-linux-260302144937
  AZURE_RESOURCE_GROUP: rg-tin200-260302144937
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  DOTNET_VERSION: '9.0'
  HEALTH_PATH: /health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release --no-restore

      - name: Publish for Linux
        run: dotnet publish TINWeb.csproj --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure app settings and connection string
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_HTTPS_PORT=443 ConnectionStrings__DefaultConnection='${{ secrets.AZURE_SQL_CONNECTION_STRING }}' EmailEvents__Enabled=true EmailEvents__AzPath=az

          az webapp config connection-string set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --connection-string-type SQLAzure \
            --settings DefaultConnection='${{ secrets.AZURE_SQL_CONNECTION_STRING }}'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          startup-command: dotnet TINWeb.dll

      - name: Smoke test health endpoint
        shell: bash
        run: |
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net${{ env.HEALTH_PATH }}"
          LOGIN_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/Login"
          EMAIL_EVENTS_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/Survey/EmailEvents"
          health_ok=false

          echo "Health URL: $HEALTH_URL"

          for i in {1..10}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed."
              health_ok=true
              break
            fi

            echo "Attempt $i/10 failed with HTTP $status. Retrying in 10s..."
            sleep 10
          done

          if [ "$health_ok" != "true" ]; then
            echo "Health check failed after 10 attempts."
            exit 1
          fi

          login_status=$(curl -s -o /dev/null -w "%{http_code}" "$LOGIN_URL" || true)
          if [ "$login_status" != "200" ]; then
            echo "Login endpoint check failed with HTTP $login_status"
            exit 1
          fi

          email_events_status=$(curl -s -o /dev/null -w "%{http_code}" "$EMAIL_EVENTS_URL" || true)
          if [ "$email_events_status" != "302" ]; then
            echo "Email Events anonymous redirect check failed with HTTP $email_events_status"
            exit 1
          fi

          echo "Smoke checks passed for health/login/email-events."

      - name: Verify deployment
        run: |
          echo "Deployment to ${{ env.AZURE_WEBAPP_NAME }} completed"
          echo "App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
